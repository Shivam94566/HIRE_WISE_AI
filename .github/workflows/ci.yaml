name: HireWise MLOps CI/CD Pipeline

# Trigger workflow on push and pull requests targeting the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permissions required for reading repository contents and publishing packages to GHCR
permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Automated Unit Testing
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone the repository source code
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Configure Python 3.12 environment with pip caching
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "mlops/requirements.txt"

      # Step 3: Upgrade pip and install all mlops dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mlops/requirements.txt

      # Step 4: Run pytest test suite in mlops directory
      - name: Run pytest tests
        run: |
          python -m pytest mlops/tests

  # Job 2: Build & Push Docker Image (runs only after tests pass and only on push to main)
  build:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code for building Docker container
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Authenticate with GitHub Container Registry using automatic GITHUB_TOKEN
      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Extract short git commit SHA for tagging images
      - name: Get short commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Step 4: Convert repository name to lowercase as required by ghcr.io
      - name: Sanitize image repository name
        id: repo
        run: echo "image_name=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      # Step 5: Build container image from ./mlops and push tags (latest + short_sha)
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./mlops
          file: ./mlops/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.image_name }}:latest
            ${{ steps.repo.outputs.image_name }}:${{ steps.vars.outputs.short_sha }}
